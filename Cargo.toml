[package]
name = "deej-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
log = "0.4.34"
notify-debouncer-full = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.1.0"
simplelog = "0.12.2"
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-serial = "5.5.0"
tokio-util = { version = "0.7.19", features = ["codec"] }
