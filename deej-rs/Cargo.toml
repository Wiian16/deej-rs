[package]
name = "deej-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
deej-lib = { path = "../deej-lib" }
log = "0.4.34"
notify-debouncer-full = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.2.0"
simplelog = "0.12.2"
tokio = { version = "1.53.1", features = ["rt", "signal"] }
tokio-util = "0.7.19"
